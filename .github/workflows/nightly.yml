# Build the release pack (scripts/make-release.sh) on every commit.
#   - pull requests: the zip is kept as a workflow artifact only
#   - pushes to master: the zip also replaces the asset on the "nightly" pre-release, and the
#     "nightly" tag is moved to the commit it was built from
name: nightly

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# one nightly at a time; a newer commit cancels a build still running for an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for `git describe` (the version shown in the about menu)

      # The nightly tag would otherwise win `git describe --tags` ("nightly-1-g<sha>").
      - name: Drop the nightly tag locally
        run: git tag -d nightly || true

      - name: Build the release pack
        id: pack
        run: |
          ./scripts/make-release.sh
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sloperinaGZ-${{ steps.pack.outputs.version }}-${{ github.sha }}
          path: release/sloperinaGZ-${{ steps.pack.outputs.version }}.zip
          if-no-files-found: error

  nightly:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: nightly
      ASSET: sloperinaGZ-nightly.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sloperinaGZ-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: pack

      - name: Move the nightly tag to this commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Write the release notes
        run: |
          short=$(git rev-parse --short "$GITHUB_SHA")
          {
            echo "Automatic build of \`master\` at $short ($(date -u +'%Y-%m-%d %H:%M UTC'))."
            echo "Version ${{ needs.build.outputs.version }}, not a numbered release: it may be untested."
            echo
            echo "Install it as described in INSTALLATION.md (inside the zip)."
            echo
            echo "Commit: ${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA"
            echo
            echo '```'
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
            echo '```'
          } > notes.md

      - name: Publish the nightly pre-release
        run: |
          mv pack/*.zip "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nightly" --notes-file notes.md --prerelease --latest=false
            # remove every old asset, so a VERSION change doesn't leave stale files behind
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              [ "$a" = "$ASSET" ] || gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "Nightly" --notes-file notes.md \
              --prerelease --latest=false --verify-tag
          fi
